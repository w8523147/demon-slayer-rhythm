<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鋼琴塊模式 - 日輪之律</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap');
        
        :root { 
            --tile-black: #111111;
            --tile-active: #2dd4bf; /* 點擊時的亮藍綠色 */
            --bg-top: #ffe6f2;      /* 背景粉色漸層 */
            --bg-bottom: #ffb3d9;
            --tile-long: #8b5cf6;   /* 長按音符的亮紫色 */
            --tile-long-dark: #5b21b6; /* 長按音符的深紫色 */
        }
        
        body {
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            color: #333; font-family: 'Nunito', sans-serif;
            overflow: hidden; margin: 0; touch-action: none; user-select: none;
        }

        /* 遊戲區域 */
        #play-area { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            display: flex; max-width: 500px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
        }

        /* 四條軌道 */
        .lane {
            flex: 1; position: relative; height: 100%;
            border-right: 2px solid rgba(255,255,255,0.6);
        }
        .lane:last-child { border-right: none; }
        .lane.active { background: rgba(45, 212, 191, 0.1); } /* 點擊時軌道發光 */

        /* 判定線 */
        #hit-line {
            position: absolute; bottom: 15vh; width: 100%; height: 4px;
            background: rgba(0,0,0,0.1); z-index: 50; pointer-events: none;
            border-top: 2px dashed rgba(255,255,255,0.8);
        }

        /* 鋼琴方塊 (短按) */
        .piano-tile {
            position: absolute; width: 100%; 
            background: var(--tile-black);
            z-index: 40; will-change: transform;
            border: 1px solid #000;
            box-sizing: border-box;
            border-radius: 6px; 
        }

        /* 長按音符的特殊樣式 (紫色漸層與立體邊框) */
        .piano-tile.long-tile {
            background: linear-gradient(to bottom, var(--tile-long) 0%, var(--tile-long-dark) 100%);
            border-left: 4px solid #c4b5fd;
            border-right: 4px solid #c4b5fd;
            border-bottom: 8px solid #4c1d95; 
            box-shadow: inset 0 0 15px rgba(255,255,255,0.2); 
        }

        /* 按下的狀態 (科技亮藍綠色) */
        .piano-tile.active {
            background: var(--tile-active);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.8), 0 0 20px var(--tile-active);
            border-color: #fff;
        }

        /* 點擊特效 (波紋) */
        .ripple {
            position: absolute; left: 50%; bottom: 15vh;
            transform: translate(-50%, 50%); width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(45,212,191,0) 70%);
            border-radius: 50%; z-index: 60; pointer-events: none;
            animation: ripple-anim 0.4s ease-out forwards;
        }
        @keyframes ripple-anim {
            0% { transform: translate(-50%, 50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, 50%) scale(2); opacity: 0; }
        }

        /* 判定文字 */
        .local-judgement {
            position: absolute; transform: translate(-50%, -50%);
            font-size: 2.5rem; font-weight: 900;
            color: #d946ef; 
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100; pointer-events: none;
            animation: float-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes float-up {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5) rotate(-5deg); }
            50% { transform: translate(-50%, -100%) scale(1.2) rotate(5deg); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
        }

        /* UI 層 */
        .glass-ui { background: rgba(255, 255, 255, 0.8); border: 2px solid #fff; box-shadow: 0 8px 32px rgba(255,105,180,0.2); border-radius: 12px; backdrop-filter: blur(8px); }
        .diff-btn { border: 2px solid #ffb3d9; padding: 8px; font-size: 0.9rem; color: #d946ef; border-radius: 8px; transition: 0.2s; font-weight: 800; }
        .diff-btn.active { background: #d946ef; color: #fff; border-color: #d946ef; }
    </style>
</head>
<body>

    <div id="play-area">
        <div class="lane" data-idx="0"></div>
        <div class="lane" data-idx="1"></div>
        <div class="lane" data-idx="2"></div>
        <div class="lane" data-idx="3"></div>
        <div id="hit-line"></div>
    </div>

    <div class="absolute top-4 left-4 z-50 pointer-events-none">
        <div class="text-4xl font-black text-pink-500 drop-shadow-md" id="score-display">0</div>
        <div class="text-lg font-bold text-teal-400 drop-shadow-md">COMBO <span id="combo-display">0</span></div>
    </div>

    <div id="pause-btn-container" class="absolute top-4 right-4 z-50 hidden">
        <button onclick="togglePause()" class="bg-white/80 text-pink-500 p-3 rounded-full shadow-lg font-black text-xl hover:bg-white active:scale-95 transition">
            ⏸
        </button>
    </div>

    <div id="start-screen" class="absolute inset-0 z-[200] flex flex-col items-center justify-center bg-black/60 p-6 text-center backdrop-blur-sm">
        <h1 class="text-6xl font-black text-white drop-shadow-[0_4px_10px_rgba(255,105,180,0.8)] mb-8" style="-webkit-text-stroke: 2px #d946ef;">魔幻鋼琴塊</h1>

        <div class="glass-ui p-6 w-full max-w-sm">
            <div class="mb-5 text-left">
                <p class="text-pink-500 font-black mb-2">♪ 選擇歌曲</p>
